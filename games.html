<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE — Henry Cubric</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg:     #0a0a0f;
    --panel:  #0f0f1a;
    --border: #1a1a3a;
    --cyan:   #00fff0;
    --yellow: #ffd700;
    --purple: #bf5fff;
    --green:  #39ff14;
    --red:    #ff3131;
    --blue:   #3f8fff;
    --orange: #ff8c00;
    --text:   #c8c8e0;
    --dim:    #3a3a5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    overflow-x: hidden;
  }

  /* CRT scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 998;
  }

  /* ── BACK LINK ── */
  #back {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    font-size: 0.35rem;
    color: var(--dim);
    text-decoration: none;
    letter-spacing: 0.1em;
    transition: color 0.2s;
    z-index: 1000;
  }
  #back:hover { color: var(--cyan); }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 3.5rem 1rem 1.5rem;
  }

  .arcade-title {
    font-size: clamp(1.4rem, 5vw, 3rem);
    letter-spacing: 0.5em;
    color: var(--yellow);
    text-shadow: 0 0 20px var(--yellow), 0 0 60px rgba(255,215,0,0.4);
    animation: flicker 5s infinite;
  }

  .arcade-sub {
    margin-top: 0.9rem;
    font-size: 0.4rem;
    letter-spacing: 0.3em;
    color: var(--dim);
  }

  .coin-prompt {
    margin-top: 1.6rem;
    font-size: 0.45rem;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
    animation: blink 1.2s step-start infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.6; }
    94% { opacity: 1; }
    95% { opacity: 0.4; }
    96% { opacity: 1; }
  }

  /* ── DIVIDER ── */
  .divider {
    margin: 0 auto 2.5rem;
    width: min(700px, 90%);
    height: 1px;
    background: linear-gradient(to right, transparent, var(--cyan), transparent);
    box-shadow: 0 0 10px var(--cyan);
    opacity: 0.4;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.6rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* ── CARD ── */
  .card {
    position: relative;
    border: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: border-color 0.25s, transform 0.25s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-4px);
  }

  .card:hover .card-border-top { transform: scaleX(1); }
  .card:hover .card-canvas-overlay { opacity: 0; }
  .card:hover .play-btn { opacity: 1; transform: translateY(0); }

  .card-border-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }

  /* Preview canvas */
  .card-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #050508;
    overflow: hidden;
  }

  .card-preview canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-canvas-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,5,8,0.45);
    transition: opacity 0.3s;
  }

  .play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% + 8px));
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    padding: 0.6rem 1.1rem;
    border: 1px solid currentColor;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }

  /* Card info */
  .card-info {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 1;
  }

  .card-name {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
  }

  .card-desc {
    font-size: 0.32rem;
    line-height: 1.9;
    color: var(--dim);
    letter-spacing: 0.05em;
  }

  .card-tags {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.3rem;
  }

  .tag {
    font-size: 0.28rem;
    letter-spacing: 0.1em;
    padding: 0.25rem 0.5rem;
    border: 1px solid;
    opacity: 0.6;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.3rem;
    letter-spacing: 0.15em;
    color: var(--dim);
    border-top: 1px solid var(--border);
  }

  footer a { color: var(--cyan); text-decoration: none; }
</style>
</head>
<body>

<a id="back" href="index.html">← BACK TO PORTFOLIO</a>

<header>
  <div class="arcade-title">ARCADE</div>
  <div class="arcade-sub">HENRY CUBRIC · GAMES</div>
  <div class="coin-prompt">— PRESS PLAY —</div>
</header>

<div class="divider"></div>

<div class="grid" id="game-grid"></div>

<footer>
  <a href="index.html">← HENRYCUBRIC.GITHUB.IO</a>
  &nbsp;&nbsp;·&nbsp;&nbsp;
  MADE WITH HTML5 CANVAS
</footer>

<script>
const GAMES = [
  {
    id: 'goldilocks',
    name: 'GOLDILOCKS',
    url: 'goldilocks.html',
    desc: 'Daily word game. Not too common, not too rare. Land your answers in the green.',
    color: '#4dffa0',
    tags: ['DAILY', 'WORDS'],
    draw(ctx, w, h, t) {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0a0824';
      ctx.fillRect(0, 0, w, h);
      const cx = w * 0.32, cy = h / 2;
      // Habitable zone ring
      ctx.lineWidth = 22;
      ctx.strokeStyle = 'rgba(77,255,160,0.18)';
      ctx.beginPath(); ctx.arc(cx, cy, 92, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,214,90,0.8)';
      ctx.beginPath(); ctx.arc(cx, cy, 92, 0, Math.PI * 2); ctx.stroke();
      // Sun
      ctx.shadowColor = '#ffc531';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ffc531';
      ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#5a2a0a';
      ctx.fillRect(cx - 9, cy - 6, 4, 6);
      ctx.fillRect(cx + 5, cy - 6, 4, 6);
      ctx.fillRect(cx - 6, cy + 8, 12, 3);
      // Planets: scorched, just right, frozen
      [[50, '#ff6b35', 0.03], [92, '#2f8ff0', 0.02], [138, '#bfe6ff', 0.012]].forEach(([r, col, sp], i) => {
        const a = t * sp + i * 2.1;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r * 0.9;
        ctx.shadowColor = col;
        ctx.shadowBlur = 12;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(px, py, i === 1 ? 9 : 7, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        if (i === 1) { ctx.fillStyle = '#5fe07a'; ctx.beginPath(); ctx.arc(px - 2, py - 2, 4, 0, Math.PI * 2); ctx.fill(); }
      });
    }
  }
];

// Build cards
const grid = document.getElementById('game-grid');

GAMES.forEach(game => {
  const card = document.createElement('a');
  card.href = game.url;
  card.className = 'card';
  card.innerHTML = `
    <div class="card-border-top" style="background:${game.color};box-shadow:0 0 10px ${game.color};"></div>
    <div class="card-preview">
      <canvas id="prev-${game.id}" width="320" height="240"></canvas>
      <div class="card-canvas-overlay"></div>
      <div class="play-btn" style="color:${game.color};box-shadow:0 0 14px ${game.color}40;">▶ PLAY</div>
    </div>
    <div class="card-info">
      <div class="card-name" style="color:${game.color};text-shadow:0 0 10px ${game.color};">${game.name}</div>
      <div class="card-desc">${game.desc}</div>
      <div class="card-tags">
        ${game.tags.map(t => `<span class="tag" style="border-color:${game.color};color:${game.color};">${t}</span>`).join('')}
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// Animate previews
let t = 0;
function animatePreviews() {
  GAMES.forEach(game => {
    const canvas = document.getElementById(`prev-${game.id}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    game.draw(ctx, canvas.width, canvas.height, t);
  });
  t++;
  requestAnimationFrame(animatePreviews);
}
animatePreviews();
</script>
</body>
</html>
